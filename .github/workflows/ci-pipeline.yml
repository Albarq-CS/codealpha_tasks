name: CI/CD Pipeline - Docker Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب ملفات المشروع من مستودع الـ GitHub السحابي
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. التحقق من وجود ملف الـ HTML وقراءته كخطوة فحص أولية
    - name: Verify Project Files
      run: |
        echo "Starting Code Verification..."
        cat index.html
        echo "HTML file exists and is validated!"

    # 3. بناء صورة الدوكر فحصاً آلياً للتأكد من خلو الـ Dockerfile من الأخطاء
    - name: Build Docker Image
      run: |
        docker build -t hello-albarq:latest .
        echo "Docker Image built successfully on GitHub Servers! ✅"